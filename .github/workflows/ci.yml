name: ci

# paths-ignore keeps docs-only work out of CI. Two consequences worth knowing before you conclude
# a branch is broken: a push carrying no file changes at all (an --allow-empty commit) matches
# nothing outside the ignore list and so runs nothing, and a manual workflow_dispatch bypasses the
# filter entirely but reports live-sims and fuzz-smoke as skipped, because both are pull_request-only.
# The live-peer gate can therefore only be exercised by a pull request.
on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

jobs:
  ci:
    # Reusable component CI from the org defaults repo (DESIGN §12.4, the file-replicator/
    # telemetry-processor pattern). `secrets: inherit` passes the org-level EDGECOMMONS_READ_TOKEN so
    # cargo can fetch the private edgecommons git dependency; the repo must be on that secret's
    # repository allow-list (org Actions secrets, via the REST API).
    #
    # This repo is a Cargo **virtual workspace** (root Cargo.toml has `[workspace]` and NO `[package]`,
    # D-EIP-17: `crates/enip` + `crates/ethernet-ip-adapter`). In a virtual manifest a bare
    # `cargo build` / `cargo test` / `cargo clippy` at the root operates on ALL members — i.e. the
    # reusable workflow's `cargo build --all-targets` / `cargo test` / `cargo clippy --all-targets`
    # ARE workspace-wide here, covering both crates, without needing an explicit `--workspace`. (The
    # `crates/enip/fuzz` harness is its own separate workspace, so it is correctly excluded from these
    # commands and built only by the `fuzz-smoke` job below.)
    permissions:
      contents: read
    uses: edgecommons/.github/.github/workflows/component-ci.yml@main
    with:
      language: RUST
      # No `rust-features`: the adapter's default feature is `standalone` (dual-broker MQTT, no C
      # toolchain), which is exactly what CI should build/test on Linux. `greengrass` is Linux-only via
      # the C-FFI SDK and is validated on the lab device (DESIGN §12.4), not in this hosted job.
      #
      # `locked: true` makes the reusable job's `cargo build`/`test`/`clippy` pass `--locked`, which is
      # what lets D-EIP-30 say "every CI job that resolves dependencies" and mean it — the in-repo
      # `coverage` and `live-sims` jobs already do. Without it this job re-resolves silently, which is
      # exactly how the committed lock came to carry no `source = "git+…"` for `edgecommons` at all
      # while CI stayed green. The input is an org-workflow opt-in defaulting to `false`, so turning it
      # on here changes nothing for any other component.
      locked: true
    secrets: inherit

  fmt:
    # Formatting is a gate, not a preference. Without one the drift is invisible until someone runs
    # `cargo fmt` and buries a real change under a thousand reformatted hunks — which is exactly how
    # this repo accumulated 1107 of them. Both workspaces are checked: `crates/enip/fuzz` is a
    # SEPARATE workspace (its own Cargo.toml, excluded from the root one), so `--all` at the root
    # does not reach it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: cargo fmt (workspace)
        run: cargo fmt --all --check
      - name: cargo fmt (fuzz workspace)
        working-directory: crates/enip/fuzz
        run: cargo fmt --all --check

  coverage:
    # The 90%-line coverage gate (NFR / DESIGN §12.1), actually RUN here — the reusable component-ci
    # only does build/test/clippy. Measured WORKSPACE-WIDE (D-EIP-17 folded the protocol crate into
    # the same denominator as the adapter; there is no per-crate carve-out).
    #
    # NO PRODUCT FILE IS EXCLUDED (DESIGN §12.2). Every driver, loop and live-socket backend in this
    # repo is inside the denominator and unit-tested against injected seams — `Publisher` for the
    # broker, `DeviceBackend`/`DeviceSession`/`PushSession` for the wire, `EventSink` for the `evt`
    # surface, and, for `eip/live.rs`, a scripted EtherNet/IP peer on loopback TCP/UDP sockets. The
    # exclusion list is three NON-product categories, each pinned to its reason:
    #   - `crates/enip/tests/live_{cpppo,opener,ab_server,ethernetipsharp,tls,cip_security}.rs` — the
    #     six live-peer conformance suites (DESIGN §11.3). Each probes its peer's port and self-skips
    #     when the container is down, so on a runner with no peers they are dead test code, not
    #     evidence about product code. They are the CONFORMANCE evidence against independent
    #     implementations (cpppo, OpENer, libplctag ab_server, EthernetIPSharp, an OpenSSL TLS
    #     terminator, OpENer's CIPSecurity branch), which is a different question from coverage.
    #   - `crates/enip/fuzz/**` — libFuzzer harnesses. They EXERCISE covered product code; they are not
    #     product code. (Also a separate workspace, so not even built here — belt-and-suspenders.)
    #   - `crates/ethernet-ip-adapter/src/testutil.rs` — `#[cfg(test)]`-only recording test doubles and
    #     the throwaway PKI/EST responder they share; compiled out of the shipped binary.
    # What that leaves INSIDE the denominator and UNCOVERED, counted against the gate rather than
    # laundered out: `supervisor.rs`'s EdgeCommons construction glue and `publish_sink.rs`'s
    # `FacadePublisher` (both need an `Arc<EdgeCommons>`/`DataFacade`, and the core library's offline
    # test constructor is `pub(crate)` — a dependent crate cannot build one), the binary entry
    # `main.rs`, and the protocol crate's own live-socket runtime (`enip/io.rs`'s class-1 UDP manager,
    # `client/io_service.rs`, `client/mod.rs`'s TCP connect). Those are exercised by the HOST /
    # full-system E2E and the deployed regression (DESIGN §12.4). Do NOT add exclusions to dodge the
    # gate — add tests (DESIGN §12.2).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        # Name the tool explicitly rather than via an `@<tool>` tag: those tags are periodically
        # rewritten to `@<version>` by dependabot, which leaves the action with no tool to install
        # and silently installs nothing.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Authenticate to the private edgecommons git dependency
        env:
          # Same org read token the reusable workflow uses (secrets: inherit); the repo must be on that
          # secret's allow-list. Rewrites the https git URL so cargo can fetch the private dep. (The
          # `enip` crate has no edgecommons dep, but the adapter crate does — D-EIP-17.)
          EDGECOMMONS_READ_TOKEN: ${{ secrets.EDGECOMMONS_READ_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${EDGECOMMONS_READ_TOKEN}@github.com/edgecommons/edgecommons.git".insteadOf \
            "https://github.com/edgecommons/edgecommons.git"
          git config --global \
            url."https://x-access-token:${EDGECOMMONS_READ_TOKEN}@github.com/edgecommons/edgecommons".insteadOf \
            "https://github.com/edgecommons/edgecommons"
          git config --global \
            url."https://x-access-token:${EDGECOMMONS_READ_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Lockfile is the build plan — fail fast if it cannot satisfy the manifests
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        # Cheap, and it fails with a lock diagnostic instead of burying one 15 minutes into an
        # instrumented build. The `--locked` on llvm-cov below is the real gate; this is the
        # readable one. (D-EIP-30.)
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Coverage gate (90% lines, workspace-wide; no product file excluded — live-peer suites + fuzz workspace + test doubles only)
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        # `--locked` is load-bearing, not tidiness: the committed lock had been generated with the
        # gitignored local-path `[patch]` active, so it carried no git source for `edgecommons` at
        # all. Every clean build silently re-resolved and rewrote a tracked file, and a genuinely
        # reproducible build was impossible. Without this flag CI cannot tell the difference.
        run: >
          cargo llvm-cov --workspace --locked
          --ignore-filename-regex '(tests[/\\]live_(cpppo|opener|ab_server|ethernetipsharp|tls|cip_security)\.rs|testutil\.rs|fuzz[/\\])'
          --fail-under-lines 90
          --cobertura --output-path target/cobertura.xml

  fuzz-smoke:
    # Decoder fuzzing as a release gate (D-EIP-19 / PROTOCOL-DESIGN §12.3): a reproducible panic/OOM
    # found by fuzzing is a ship blocker. Runs on every PR with a SHORT budget (a smoke, not a
    # campaign — longer runs are a periodic job). The `crates/enip/fuzz` harness is a separate
    # workspace with NO edgecommons dependency (the protocol crate knows nothing about EdgeCommons,
    # D-EIP-17), so this job needs no private-git token.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly toolchain (libFuzzer needs nightly + the sanitizer runtime)
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - name: Install cargo-fuzz
        # Explicit tool name — the `@cargo-fuzz` tag resolved to an empty input, so cargo-fuzz was
        # never installed and this gate failed at `cargo fuzz build` on every PR since the repo
        # opened. D-EIP-19 makes fuzzing a release gate; it has to actually run.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Build every fuzz target (a target that stops compiling is a defect)
        working-directory: crates/enip
        # Name the target triple explicitly. cargo-fuzz otherwise defaults to the triple of its own
        # binary, and the installed binary is a static musl build — so it asks the nightly toolchain
        # for a musl std that `--profile minimal` never installed and dies on `can't find crate for
        # core`.
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
      - name: Smoke-run EVERY fuzz target over the checked-in corpus + regressions
        working-directory: crates/enip
        # EVERY target, enumerated with `cargo fuzz list` rather than named here, so a new hostile
        # surface joins the gate by existing — the same self-syncing property `enip::harness::SURFACES`
        # gives the corpus regression, and the reason a target can never be forgotten at review time.
        # -max_total_time keeps each one a SHORT smoke (the per-PR budget is deliberately cheap); the
        # long budgets live in the weekly campaign, .github/workflows/fuzz-weekly.yml — the two
        # cadences PROTOCOL-DESIGN §12.3 specifies. A crash exits non-zero and is committed as a
        # regression input.
        run: |
          targets="$(cargo +nightly fuzz list)"
          if [ -z "$targets" ]; then
            echo "::error title=fuzz gate found no targets::cargo fuzz list printed nothing — the smoke would pass vacuously"
            exit 1
          fi
          echo "fuzz targets under smoke: $(echo "$targets" | tr '\n' ' ')"
          for target in $targets; do
            echo "::group::fuzz smoke: $target"
            cargo +nightly fuzz run "$target" --target x86_64-unknown-linux-gnu -- -max_total_time=30
            echo "::endgroup::"
          done

  live-sims:
    # The LIVE-PEER CONFORMANCE GATE (DESIGN §11.3). Every suite that validates this stack against an
    # INDEPENDENT EtherNet/IP implementation runs here, against real peers, on every PR — cpppo,
    # libplctag's ab_server, EthernetIPSharp, an OpenSSL stunnel terminator (plus a CBC-only one),
    # OpENer, OpENer's CIPSecurity branch, and globalsign/est's estserver — plus the three in-source
    # live tests in the adapter crate (client-cert rotation, near-expiry, EST enrollment).
    #
    # `ENIP_LIVE_REQUIRED: "1"` is what makes this a gate rather than a formality: every suite probes
    # its peer and self-skips when the port is closed (the bench-friendly default), and under this
    # variable a missing peer becomes an assertion failure naming the peer, the address and the
    # command that starts it. Without it a runner with no containers would print "skipped (…)" and
    # report success — the exact vacuous pass this job exists to prevent.
    #
    # Peer topology on the runner:
    #   - the TCP peers run from compose with test-infra/ci-overrides.yaml layered on top, which
    #     publishes cpppo on 127.0.0.1 ONLY (that file documents why);
    #   - OpENer runs on HOST networking as `opener-live`, because the class-1 (implicit I/O) legs
    #     need a symmetric T→O UDP return path that a bridge-NATed container cannot give (DESIGN
    #     §11.2/§11.5). It takes the runner's primary IPv4 at :44818, which is free precisely because
    #     cpppo is published on loopback.
    # What still does NOT execute, and why (peer limits, not skipped work — DESIGN §11.3): cpppo
    # refuses a class-3 ForwardOpen, so live_cpppo's idle leg early-returns and OpENer carries that
    # claim; EthernetIPSharp serves only page 1 of a tag list, so the multi-page resume asserts the
    # typed refusal. Both are in-body assertions, not probe skips.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # Six container image builds per PR is the cost of this job. Superseded runs of the same PR are
    # cancelled rather than left to finish (the risk-budget mitigation); the workflow-level
    # paths-ignore already keeps docs-only PRs out entirely.
    concurrency:
      group: live-sims-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Cache the cargo registry + target dir
        # The same action the org reusable component-ci uses. The live suites are ordinary cargo test
        # binaries, so a warm cache is the difference between ~5 min and ~1 min of compiling before a
        # single frame goes on the wire.
        uses: Swatinem/rust-cache@v2
      - name: Authenticate to the private edgecommons git dependency
        env:
          # Same block as the coverage job (secrets: inherit). Needed even though most steps only run
          # `-p ec-enip`: cargo resolves the WHOLE workspace, and the adapter crate carries the
          # edgecommons git dependency.
          EDGECOMMONS_READ_TOKEN: ${{ secrets.EDGECOMMONS_READ_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${EDGECOMMONS_READ_TOKEN}@github.com/edgecommons/edgecommons.git".insteadOf \
            "https://github.com/edgecommons/edgecommons.git"
          git config --global \
            url."https://x-access-token:${EDGECOMMONS_READ_TOKEN}@github.com/edgecommons/edgecommons".insteadOf \
            "https://github.com/edgecommons/edgecommons"
          git config --global \
            url."https://x-access-token:${EDGECOMMONS_READ_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Generate the throwaway test PKIs (gitignored)
        # BEFORE the image build: test-infra/est/Dockerfile COPYs certs/ into the estserver image, and
        # the stunnel terminators bind-mount test-infra/enip-tls/certs at run time. The same PKIs are
        # what the live suites present as client identities.
        #
        # Invoked through `bash` rather than as `./…`: the repo's shell scripts are tracked mode
        # 100644 (they are authored on Windows, where the executable bit does not survive), so a
        # fresh Linux checkout cannot exec them directly.
        run: |
          bash ./test-infra/enip-tls/gen-certs.sh
          bash ./test-infra/est/gen-certs.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build the sim images (parallel, GitHub Actions layer cache)
        # bake builds all six targets CONCURRENTLY and reads its plan from the same two compose files
        # the job brings the peers up with, so the image tags cannot drift from the compose services.
        # type=gha caching is what keeps a warm PR near the bottom of the ~10-14 min uncached build
        # cost (OpENer/CMake, the OpENer CIPSecurity branch, ab_server, a .NET publish, a Go build).
        # cpppo is a plain image pull, so it has no target here.
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            compose.yaml
            test-infra/ci-overrides.yaml
          targets: |
            enip-ab-server
            enip-sharp
            enip-tls
            opener-cipsec
            est-server
            enip-io-sim
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - name: Start the TCP peers
        run: >
          docker compose -f compose.yaml -f test-infra/ci-overrides.yaml up -d
          enip-sim enip-ab-server enip-sharp enip-tls enip-tls-cbc opener-cipsec est-server
      - name: Start OpENer on the host network
        # The interface name is OpENer's own argument (it derives its CIP TCP/IP object address from
        # it), so the address the suites dial is derived from the SAME interface. Empty detection is a
        # hard failure here rather than a mystery timeout later.
        run: |
          IFACE="$(ip -o route get 1.1.1.1 | sed -n 's/.*dev \([^ ]*\).*/\1/p' | head -n1)"
          if [ -z "$IFACE" ]; then
            echo "::error title=runner interface detection failed::ip route get 1.1.1.1 named no device"
            exit 1
          fi
          RUNNER_IP="$(ip -o -4 addr show "$IFACE" | awk '{print $4}' | cut -d/ -f1 | head -n1)"
          if [ -z "$RUNNER_IP" ]; then
            echo "::error title=runner IP detection failed::no IPv4 on $IFACE"
            exit 1
          fi
          echo "OpENer will run on host networking, interface $IFACE ($RUNNER_IP)"
          echo "OPENER_ADDR=${RUNNER_IP}:44818" >> "$GITHUB_ENV"
          docker run -d --name opener-live --network host enip-sim-opener:ci "$IFACE"
      - name: Wait for every peer port
        # A bounded, explicit readiness gate — never a bare sleep, and never an unbounded wait. If a
        # peer never accepts, this names it and stops here, where the container logs are the obvious
        # next step, instead of failing later as an ENIP_LIVE_REQUIRED assertion.
        run: |
          bash ./test-infra/wait-ports.sh \
            cpppo=127.0.0.1:44818 \
            ab_server=127.0.0.1:44820 \
            ethernetipsharp=127.0.0.1:44821 \
            stunnel-tls=127.0.0.1:2221 \
            stunnel-cbc=127.0.0.1:2223 \
            opener-cipsecurity=127.0.0.1:44822 \
            est-server=127.0.0.1:8443 \
            opener="$OPENER_ADDR"
      - name: enip live suites — the TCP peers, skip-free
        env:
          ENIP_LIVE_REQUIRED: "1"
        run: |
          cargo test --locked -p ec-enip --test live_cpppo --test live_ab_server \
            --test live_ethernetipsharp --test live_cip_security -- --nocapture
          cargo test --locked -p ec-enip --features tls --test live_tls -- --nocapture
      - name: adapter in-source live tests — EST enrollment + TLS cert rotation, skip-free
        env:
          ENIP_LIVE_REQUIRED: "1"
        # A NAME filter, not an exact list, so a new in-source live test joins the gate by being
        # named `live_…`. It sweeps in a handful of ordinary unit tests whose names happen to contain
        # the substring (`…keepalive_…`, `…the_live_…`); they are fast and hermetic, and running them
        # twice costs nothing next to letting a live test sit outside the gate.
        run: cargo test --locked -p ethernet-ip-adapter live_ -- --nocapture
      - name: live_opener — class-3 idle + latest-wins flood (the peer must stay alive)
        env:
          ENIP_LIVE_REQUIRED: "1"
        # OPENER_ADDR comes from the host-network step. OPENER_STOP_CMD is deliberately ABSENT here:
        # these two legs need OpENer alive.
        #
        # --test-threads=1 because both legs drive the SAME single-threaded OpENer sample: a class-1
        # connection that times out makes OpENer close the TCP session the class-3 leg is idling on,
        # so run in parallel one root cause reports as two failures. Serially the 75 s idle and the
        # 10 s flood cost ~10 s more and each leg's verdict is its own.
        run: |
          cargo test --locked -p ec-enip --test live_opener -- --nocapture --test-threads=1 \
            opener_live_class3 opener_live_slow_consumer
      - name: live_opener — the watchdog leg LAST (it kills the peer)
        env:
          ENIP_LIVE_REQUIRED: "1"
          # Supplying the stop command is what makes the watchdog assertion execute in the gate; the
          # leg stays soft on a bench that cannot silence its peer. It is a separate, final step
          # because it leaves OpENer dead — inside the previous invocation it would sabotage the idle
          # and flood legs (alphabetically it would even run first).
          OPENER_STOP_CMD: "docker kill opener-live"
        run: |
          cargo test --locked -p ec-enip --test live_opener -- --nocapture --exact \
            opener_live_class1_forward_open_consume_produce_watchdog
      - name: Peer logs (on failure)
        if: failure()
        run: |
          docker compose -f compose.yaml -f test-infra/ci-overrides.yaml logs --no-color --tail=200 || true
          docker logs opener-live 2>&1 | tail -n 200 || true
      - name: Tear the peers down
        if: always()
        run: |
          docker compose -f compose.yaml -f test-infra/ci-overrides.yaml down -v || true
          docker rm -f opener-live || true
